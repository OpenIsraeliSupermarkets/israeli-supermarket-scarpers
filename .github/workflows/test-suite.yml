name: Unit & Integration Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '00 17 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: self-hosted
    outputs:
      pytest_failed: ${{ steps.test_result.outputs.failed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Free disk space
        run: |
          df --human-readable
          docker 2>/dev/null 1>&2 rmi $(docker image ls --all --quiet) || true
          rm --recursive --force "$AGENT_TOOLSDIRECTORY"
          df --human-readable
      - name: Build with Docker
        run: docker build -t erlichsefi/israeli-supermarket-scarpers:test --target test .
      - name: Remove all build
        run: (docker stop scraper-test-run 2>/dev/null || true) && (docker rm scraper-test-run 2>/dev/null || true)
      - name: Test with pytest
        id: pytest
        continue-on-error: true
        run: |
          set -o pipefail
          docker run --rm --name scraper-test-run \
            -e DISABLED_SCRAPPERS="${{ env.DISABLED_SCRAPPERS }}" \
            erlichsefi/israeli-supermarket-scarpers:test 2>&1 | tee pytest-log.txt
      - name: Docker builder prune
        if: always()
        run: docker builder prune -f
      - name: Record pytest result
        id: test_result
        if: always()
        env:
          PYTEST_CONCLUSION: ${{ steps.pytest.conclusion }}
        run: |
          if [ "$PYTEST_CONCLUSION" = "failure" ]; then
            echo "failed=true" >> "$GITHUB_OUTPUT"
          else
            echo "failed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload pytest log
        if: steps.test_result.outputs.failed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log
          path: pytest-log.txt
          if-no-files-found: warn
      - name: Fail job if pytest failed
        if: steps.test_result.outputs.failed == 'true'
        run: exit 1

  create-issue:
    needs: build
    if: failure() && needs.build.outputs.pytest_failed == 'true'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Checkout scripts
        uses: actions/checkout@v3
      - name: Download pytest log
        uses: actions/download-artifact@v4
        with:
          name: pytest-log
      - name: Create deduped issue and webhook maintainer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURSOR_MAINTAINER_WEBHOOK: ${{ secrets.CURSOR_MAINTAINER_WEBHOOK }}
          CURSOR_WEBHOOK_SECRET: ${{ secrets.CURSOR_WEBHOOK_SECRET }}
        run: |
          chmod +x .github/scripts/create_ci_issue.sh
          .github/scripts/create_ci_issue.sh pytest-log.txt

  weekend-weekly-release:
    needs: build
    if: success() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Trigger weekly release on weekend only
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          DOW=$(date -u +%w) # 0=Sun 6=Sat
          if [ "$DOW" != "0" ] && [ "$DOW" != "6" ]; then
            echo "Not weekend (DOW=${DOW}); skipping weekly release."
            exit 0
          fi
          gh workflow run weekly-release.yml \
            --repo "${{ github.repository }}" \
            --ref "${{ github.ref_name }}"
          echo "Dispatched weekly-release.yml"
