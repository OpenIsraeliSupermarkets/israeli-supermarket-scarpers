[mypy]
; Run in CI via the Dockerfile `lint` stage. Tests are excluded.
check_untyped_defs = True
ignore_missing_imports = True
follow_imports = silent
; The lint image uses a pyenv Python built without _sqlite3, which mypy 2.x
; needs for its default sqlite cache; fall back to the file cache.
sqlite_cache = False
exclude = (^|/)tests?/|(^|/)test_[^/]*\.py$
