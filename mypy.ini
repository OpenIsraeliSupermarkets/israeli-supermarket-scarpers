[mypy]
; Run in CI via the Dockerfile `lint` stage. Tests are excluded.
check_untyped_defs = True
ignore_missing_imports = True
follow_imports = silent
exclude = (^|/)tests?/|(^|/)test_[^/]*\.py$

; Baseline: modules that already had errors when mypy was introduced.
; Fix a module's errors, then delete it from this list so it stays checked.
